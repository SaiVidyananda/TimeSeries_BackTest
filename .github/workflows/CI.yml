name: Lint and Auto PR to Main

on:
  push:
    branches:
      - "feature/**"

jobs:
  lint-and-pr:
    name: Run Pylint and Create Auto-PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pylint and extract score
        id: pylint
        run: |
          OUTPUT=$(pylint $(find ./src -type f -name "*.py") || true)
          echo "$OUTPUT"
          SCORE=$(echo "$OUTPUT" | grep 'Your code has been rated at' | tail -1 | awk '{print $7}' | cut -d'/' -f1)
          echo "Pylint Score: $SCORE"
          echo "score=$SCORE" >> $GITHUB_OUTPUT

      - name: Check if score is good
        id: check-score
        run: |
          SCORE=${{ steps.pylint.outputs.score }}
          THRESHOLD=8.0
          echo "Checking if $SCORE >= $THRESHOLD"
          if (( $(echo "$SCORE < $THRESHOLD" | bc -l) )); then
            echo "❌ Pylint score $SCORE is below $THRESHOLD"
            exit 1
          else
            echo "✅ Pylint score $SCORE meets threshold"
          fi

      - name: Install GitHub CLI
        run: |
          sudo apt-get install gh -y

      - name: Set target branch
        id: find-target-branch
        run: echo "branch=main" >> $GITHUB_OUTPUT  # Or use dynamic logic

      - name: Create Pull Request
        run: |
          gh pr create \
            --base '${{ steps.find-target-branch.outputs.branch }}' \
            --head '${{ github.ref_name }}' \
            --title "[Automated] Merge ${{ github.ref_name }} into ${{ steps.find-target-branch.outputs.branch }}" \
            --body '✅ Automated PR: Pylint score passed threshold. Please review and merge.' \
            || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
