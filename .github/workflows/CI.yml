
name: Pylint Check and Auto-Merge


on:
  push:
    branches:
      - "feature/**"

jobs:
  linting:
    name: Run Pylint and Score Check
    runs-on: ubuntu-latest
    outputs:
      score: ${{ steps.pylint.outputs.score }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pylint and extract score
        id: pylint
        run: |
          OUTPUT=$(pylint $(find ./src -type f -name "*.py") || true)
          echo "$OUTPUT"
          SCORE=$(echo "$OUTPUT" | grep 'Your code has been rated at' | tail -1 | awk '{print $7}' | cut -d'/' -f1)
          echo "Pylint Score: $SCORE"
          echo "score=$SCORE" >> $GITHUB_OUTPUT

      - name: Check if score is good
        run: |
          SCORE=${{ steps.pylint.outputs.score }}
          THRESHOLD=8.0
          echo "Checking if $SCORE >= $THRESHOLD"
          if (( $(echo "$SCORE < $THRESHOLD" | bc -l) )); then
            echo "❌ Pylint score $SCORE is below threshold $THRESHOLD"
            exit 1
          else
            echo "✅ Pylint score $SCORE is acceptable"
          fi

      - name: Run tests with coverage
        id: coverage
        run: |
          PYTHONPATH=. pytest --cov=src --cov-report=term --cov-report=xml
          COVERAGE=$(coverage report | grep TOTAL | awk '{print $4}' | sed 's/%//')
          echo "Coverage is $COVERAGE%"
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Check coverage threshold
        run: |
          THRESHOLD=80
          COVERAGE=${{ steps.coverage.outputs.coverage }}
          echo "Checking if $COVERAGE >= $THRESHOLD"
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Code coverage $COVERAGE is below threshold"
            exit 1
          fi

  prcreation:
    name: Create PR into Main
    needs: linting
    if: ${{ needs.linting.outputs.score && success() }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main into current feature branch
        run: |
          git fetch origin main
          git merge origin/main --no-edit || { echo "❌ Merge conflict with main"; exit 1; }

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install gh -y

      - name: Set target branch
        id: find-target-branch
        run: echo "branch=main" >> $GITHUB_OUTPUT
      - name: Check for diff with main
        id: check-diff
        run: |
          git fetch origin main
          git diff origin/main...HEAD --quiet && echo "skip=true" >> $GITHUB_OUTPUT || echo "skip=false" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check-diff.outputs.skip == 'false'
        run: |
          if ! gh pr create \
            --base '${{ steps.find-target-branch.outputs.branch }}' \
            --head '${{ github.ref_name }}' \
            --title "[Automated] Merge ${{ github.ref_name }} into ${{ steps.find-target-branch.outputs.branch }}" \
            --body '✅ Automated PR: Pylint score passed threshold. Please review and merge.'; then
              echo "❌ Failed to create pull request"
              exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

